# Grille tarifaire Colissimo — contrat « Facilité » (identique à « Privilège »), France métropolitaine.
# PRIX HT par colis. Source : « Tarifs 2025 » de La Poste (Branche Services-Courrier-Colis), document daté du 15/11/2024,
# https://www.colissimo.entreprise.laposte.fr/media/1191/download — la grille 2026 n'était pas publiée au moment de l'écriture.
# À REMPLACER par la grille de votre contrat (espace Colissimo Entreprise) : les tarifs se modifient ensuite dans
# l'administration (Boutique > Transporteurs), cette grille ne sert que de valeur de départ.
# Le suivi est inclus. Supplément « colis non mécanisable » (non géré) : 6,50 € HT par colis.
